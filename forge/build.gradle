plugins { id 'dev.architectury.loom' }
base { archivesName = rootProject.archives_base_name }

sourceSets.main {
    java.srcDir rootProject.file('common/src/main/java')
    resources.srcDir rootProject.file('common/src/main/resources')
}

sourceSets {
    gametest {
        java.srcDirs = ['src/gametest/java', rootProject.file('common/src/gametest/java')]
        resources.srcDirs = ['src/gametest/resources']
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += output + sourceSets.main.runtimeClasspath
    }
}

configurations {
    gametestImplementation.extendsFrom implementation
    gametestRuntimeOnly.extendsFrom runtimeOnly
}


dependencies {
    minecraft libs.minecraft
    mappings loom.officialMojangMappings()
    def seamlessApi = files(rootProject.file("../seamless-api/forge/build/devlibs/seamless-api-${libs.versions.seamless.api.get()}-forge-dev.jar"))
    seamlessApi.builtBy gradle.includedBuild('seamless-api').task(':forge:jar')
    implementation seamlessApi
    forge libs.forge
    compileOnly libs.jei.common.api
}
loom {
    mixin { useLegacyMixinAp = true; defaultRefmapName = 'seamless_crafting.refmap.json' }
    mods {
        seamlesscrafting {
            sourceSet sourceSets.main
        }
        seamlesscraftinggametest {
            sourceSet sourceSets.gametest
        }
    }
    runs {
        gameTestServer {
            runtimeEnvironment = 'gametestserver'
            forgeTemplate 'gameTestServer'
            source sourceSets.gametest
            runDir 'build/gametest'
            property 'forge.enabledGameTestNamespaces', 'derk_easy_inventory_crafter'
        }
    }
}

tasks.named('runGameTestServer') {
    doLast {
        def latestLog = file('build/gametest/logs/latest.log')
        if (!latestLog.isFile()) {
            throw new GradleException("Forge GameTest did not create ${latestLog}")
        }
        def logText = latestLog.getText('UTF-8')
        def discoveries = (logText =~ /(\d+) tests are now running/).collect { match -> match[1] as int }
        def discoveredCount = discoveries.isEmpty() ? 0 : discoveries.max()
        if (discoveredCount < 12) {
            throw new GradleException(
                "Forge discovered ${discoveredCount} GameTests; expected twelve Seamless Crafting scenarios"
            )
        }
        if (!(logText =~ /All \d+ required tests passed/).find()) {
            throw new GradleException('Forge GameTest log does not contain a successful required-test summary')
        }
    }
}
tasks.named('check') { dependsOn tasks.named('runGameTestServer') }
def metadataProperties = [
    mod_version: project.version.toString(),
    loader_version_range: '[52,)',
    forge_version_range: '[52.1.16,53)',
    minecraft_version_range: '[1.21.1]'
]
processResources {
    inputs.properties metadataProperties
    filesMatching('META-INF/mods.toml') { expand metadataProperties }
}
tasks.named('jar', Jar) {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    exclude 'META-INF/MANIFEST.MF'
    manifest {
        attributes(
                'Automatic-Module-Name': 'io.github.derkottersberg.seamlesscrafting',
                'MixinConfigs': 'seamless_crafting.mixins.json'
        )
    }
    archiveFileName = "${rootProject.archives_base_name}-${project.version}-forge-dev.jar"
}
tasks.named('sourcesJar', Jar) {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    archiveFileName = "${rootProject.archives_base_name}-${project.version}-forge-sources.jar"
}

tasks.named('remapJar') { archiveFileName = "${rootProject.archives_base_name}-${project.version}-forge.jar" }

// Keep the legacy GameTest fixture reproducible without checking in binary NBT.
def generatedStructures = layout.buildDirectory.dir('generated/gametest-resources')
tasks.register('generateGameTestStructure') {
    outputs.dir generatedStructures
    doLast {
        def target = generatedStructures.get().file('data/derk_easy_inventory_crafter/structure/empty.nbt').asFile
        target.parentFile.mkdirs()
        new DataOutputStream(new java.util.zip.GZIPOutputStream(new FileOutputStream(target))).withCloseable { out ->
            out.writeByte(10); out.writeUTF('')
            out.writeByte(3); out.writeUTF('DataVersion'); out.writeInt(3955)
            out.writeByte(9); out.writeUTF('size'); out.writeByte(3); out.writeInt(3)
            [16, 4, 16].each { out.writeInt(it) }
            out.writeByte(9); out.writeUTF('palette'); out.writeByte(10); out.writeInt(1)
            out.writeByte(8); out.writeUTF('Name'); out.writeUTF('minecraft:air'); out.writeByte(0)
            ['blocks', 'entities'].each { name ->
                out.writeByte(9); out.writeUTF(name); out.writeByte(10); out.writeInt(0)
            }
            out.writeByte(0)
        }
    }
}
sourceSets.gametest.resources.srcDir generatedStructures
tasks.named('processGametestResources') { dependsOn 'generateGameTestStructure' }


tasks.named('remapSourcesJar') { archiveFileName = "${rootProject.archives_base_name}-${project.version}-forge-sources.jar" }
