name: build

on:
  push:
    branches: ['1.20.1', 'feat/**', 'fix/**']
  pull_request:

permissions:
  contents: read

defaults:
  run:
    working-directory: seamless-crafting

jobs:
  wrapper-validation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          path: seamless-crafting
      - uses: actions/checkout@v4
        with:
          repository: DerkOttersberg/seamless-api
          ref: '75fe66585274eaf7136bc0001ee5824fc696c63e'
          path: seamless-api
      - uses: gradle/actions/wrapper-validation@v4

  loader-builds:
    strategy:
      fail-fast: false
      matrix:
        loader: [fabric, forge]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          path: seamless-crafting
      - uses: actions/checkout@v4
        with:
          repository: DerkOttersberg/seamless-api
          ref: '75fe66585274eaf7136bc0001ee5824fc696c63e'
          path: seamless-api
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew --no-daemon :common:check :${{ matrix.loader }}:check :${{ matrix.loader }}:build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: seamless-crafting-${{ matrix.loader }}-reports
          if-no-files-found: ignore
          path: |
            seamless-crafting/**/build/reports/**
            seamless-crafting/**/build/test-results/**
            seamless-crafting/**/logs/**
            seamless-crafting/**/crash-reports/**

  verification:
    needs: [wrapper-validation, loader-builds]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          path: seamless-crafting
      - uses: actions/checkout@v4
        with:
          repository: DerkOttersberg/seamless-api
          ref: '75fe66585274eaf7136bc0001ee5824fc696c63e'
          path: seamless-api
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew --no-daemon clean check build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: seamless-crafting-verification
          if-no-files-found: ignore
          path: |
            seamless-crafting/**/build/reports/**
            seamless-crafting/**/build/test-results/**
            seamless-crafting/fabric/build/libs/*
            seamless-crafting/forge/build/libs/*
