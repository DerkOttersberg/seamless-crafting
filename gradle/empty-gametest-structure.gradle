// Keep the legacy GameTest fixture reproducible without checking in binary NBT.
def generatedStructures = layout.buildDirectory.dir('generated/gametest-resources')
tasks.register('generateGameTestStructure') {
    outputs.dir generatedStructures
    doLast {
        def target = generatedStructures.get().file('data/derk_easy_inventory_crafter/structure/empty.nbt').asFile
        target.parentFile.mkdirs()
        new DataOutputStream(new java.util.zip.GZIPOutputStream(new FileOutputStream(target))).withCloseable { out ->
            out.writeByte(10); out.writeUTF('')
            out.writeByte(3); out.writeUTF('DataVersion'); out.writeInt(3955)
            out.writeByte(9); out.writeUTF('size'); out.writeByte(3); out.writeInt(3)
            3.times { out.writeInt(3) }
            out.writeByte(9); out.writeUTF('palette'); out.writeByte(10); out.writeInt(1)
            out.writeByte(8); out.writeUTF('Name'); out.writeUTF('minecraft:air'); out.writeByte(0)
            ['blocks', 'entities'].each { name ->
                out.writeByte(9); out.writeUTF(name); out.writeByte(10); out.writeInt(0)
            }
            out.writeByte(0)
        }
    }
}
sourceSets.gametest.resources.srcDir generatedStructures
tasks.named('processGametestResources') { dependsOn 'generateGameTestStructure' }
