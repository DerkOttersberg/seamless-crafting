plugins {
    id 'base'
    alias(libs.plugins.architectury)
    alias(libs.plugins.loom) apply false
}

architectury { minecraft = libs.versions.minecraft.get() }

allprojects {
    group = rootProject.maven_group
    version = rootProject.mod_version

    repositories {
        mavenCentral()
        maven { url = 'https://maven.fabricmc.net/' }
        maven { url = 'https://maven.minecraftforge.net/' }
        maven { url = 'https://maven.neoforged.net/releases/' }
        maven { url = 'https://maven.architectury.dev/' }
        maven { url = 'https://maven.blamejared.com/' }
    }
}

subprojects {
    apply plugin: 'java-library'
    apply plugin: 'maven-publish'

    java {
        toolchain.languageVersion = JavaLanguageVersion.of(libs.versions.java.get().toInteger())
        withSourcesJar()
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.release = libs.versions.java.get().toInteger()
    }

    tasks.withType(Jar).configureEach {
        from(rootProject.file('LICENSE.txt')) {
            into 'META-INF'
            rename { "LICENSE_${rootProject.archives_base_name}.txt" }
        }
    }

    tasks.withType(Test).configureEach { useJUnitPlatform() }

    publishing {
        publications {
            register('mavenJava', MavenPublication) {
                from components.java
                artifactId = "${rootProject.archives_base_name}-${project.name}"
            }
        }
        repositories { mavenLocal() }
    }
}

// Gradle may otherwise overlap a loader compile that consumes common's jar with
// another project's clean task when `clean check build` runs in parallel.
def allCleanTasks = allprojects.collect { it.tasks.named('clean') }
allprojects {
    tasks.configureEach { task ->
        if (task.name != 'clean') task.mustRunAfter(allCleanTasks)
    }
}

tasks.register('verifyCommonIsolation') {
    group = 'verification'
    inputs.files(fileTree('common/src') { include '**/*.java' })
    doLast {
        def forbidden = ['net.fabricmc.', 'net.minecraftforge.', 'net.neoforged.']
        def violations = []
        inputs.files.files.sort().each { source ->
            source.eachLine { line, number ->
                if (forbidden.any { line.contains(it) }) violations << "${source}:${number}: ${line.trim()}"
            }
        }
        if (!violations.isEmpty()) throw new GradleException("Loader imports found in common:\n${violations.join('\n')}")
    }
}

def loaderJarFiles = ['fabric', 'forge', 'neoforge'].collectEntries { loader ->
    [(loader): project(":${loader}").tasks.named('jar', Jar).flatMap { it.archiveFile }]
}

tasks.register('verifyLoaderJars') {
    group = 'verification'
    dependsOn ':fabric:jar', ':forge:jar', ':neoforge:jar'
    inputs.files(loaderJarFiles.values())
    doLast {
        def specifications = [
            fabric: [expected: 'fabric.mod.json', forbidden: ['META-INF/mods.toml', 'META-INF/neoforge.mods.toml']],
            forge: [expected: 'META-INF/mods.toml', forbidden: ['fabric.mod.json', 'META-INF/neoforge.mods.toml']],
            neoforge: [expected: 'META-INF/neoforge.mods.toml', forbidden: ['fabric.mod.json', 'META-INF/mods.toml']]
        ]
        def exactVersion = rootProject.mod_version.toString()
        def requireEqual = { actual, expected, label ->
            if (actual != expected) throw new GradleException("${label}: expected '${expected}', got '${actual}'")
        }
        def requireFragments = { text, fragments, label ->
            fragments.each { fragment ->
                if (!text.contains(fragment)) throw new GradleException("${label} is missing exact metadata fragment: ${fragment}")
            }
        }
        specifications.each { loader, specification ->
            def archive = loaderJarFiles[loader].get().asFile
            requireEqual(
                archive.name,
                "${rootProject.archives_base_name}-${exactVersion}-${loader}.jar",
                "${loader} archive name"
            )
            new java.util.zip.ZipFile(archive).withCloseable { zip ->
                if (zip.getEntry(specification.expected) == null) throw new GradleException("${archive.name} is missing ${specification.expected}")
                specification.forbidden.each { entry ->
                    if (zip.getEntry(entry) != null) throw new GradleException("${archive.name} contains stale metadata ${entry}")
                }
                if (zip.getEntry('io/github/derkottersberg/seamlesscrafting/SeamlessCraftingMod.class') == null) throw new GradleException("${archive.name} is missing common code")
                if (zip.getEntry('seamless_crafting.mixins.json') == null) throw new GradleException("${archive.name} is missing mixin metadata")
                def licenseEntry = zip.getEntry('META-INF/LICENSE_seamless-crafting.txt')
                if (licenseEntry == null) throw new GradleException("${archive.name} is missing the CC0 license file")
                def licenseText = zip.getInputStream(licenseEntry).getText('UTF-8')
                if (!licenseText.contains('SPDX-License-Identifier: CC0-1.0')
                    || !licenseText.contains('Creative Commons Legal Code')
                    || !licenseText.contains('1. Copyright and Related Rights.')
                    || !licenseText.contains('4. Limitations and Disclaimers.')
                    || licenseText.length() < 7000
                    || licenseText.contains('GNU LESSER GENERAL PUBLIC LICENSE')) {
                    throw new GradleException("${archive.name} does not contain the canonical CC0 license text")
                }

                def entryNames = []
                def entries = zip.entries()
                while (entries.hasMoreElements()) entryNames << entries.nextElement().name
                def testEntries = entryNames.findAll {
                    it.contains('/gametest/') || it.endsWith('GameTests.class') || it.endsWith('Scenario.class')
                }
                if (!testEntries.isEmpty()) {
                    throw new GradleException("${archive.name} contains GameTest-only classes: ${testEntries.join(', ')}")
                }
                if (entryNames.any { it.startsWith('mezz/jei/') }) {
                    throw new GradleException("${archive.name} bundled compile-only JEI API classes")
                }

                def fabricJeiPlugin = 'io/github/derkottersberg/seamlesscrafting/fabric/SeamlessCraftingFabricJeiPlugin.class'
                def neoJeiPlugin = 'io/github/derkottersberg/seamlesscrafting/neoforge/SeamlessCraftingNeoForgeJeiPlugin.class'
                requireEqual(entryNames.contains(fabricJeiPlugin), loader == 'fabric', "${archive.name} Fabric JEI plugin presence")
                requireEqual(entryNames.contains(neoJeiPlugin), loader == 'neoforge', "${archive.name} NeoForge JEI plugin presence")

                def metadataText = zip.getInputStream(zip.getEntry(specification.expected)).getText('UTF-8')
                if (metadataText.contains('${')) {
                    throw new GradleException("${archive.name} contains an unexpanded metadata placeholder")
                }
                def processedMetadata = file("${loader}/build/resources/main/${specification.expected}")
                if (!processedMetadata.isFile()) {
                    throw new GradleException("${loader} processed metadata is missing: ${processedMetadata}")
                }
                requireEqual(
                    metadataText.replace('\r\n', '\n').trim(),
                    processedMetadata.getText('UTF-8').replace('\r\n', '\n').trim(),
                    "${loader} processed and packaged metadata"
                )

                if (loader == 'fabric') {
                    def metadata = new groovy.json.JsonSlurper().parseText(metadataText)
                    requireEqual(metadata.schemaVersion, 1, 'Fabric schemaVersion')
                    requireEqual(metadata.id, 'seamless_crafting', 'Fabric mod id')
                    requireEqual(metadata.version, exactVersion, 'Fabric version')
                    requireEqual(metadata.name, 'Seamless Crafting', 'Fabric canonical name')
                    requireEqual(metadata.license, 'CC0-1.0', 'Fabric license')
                    def expectedDependencies = [
                        fabricloader: ">=${libs.versions.fabric.loader.get()}",
                        'fabric-api': ">=${libs.versions.fabric.supported.api.minimum.get()} <${libs.versions.fabric.supported.api.maximum.exclusive.get()}",
                        minecraft: "~${libs.versions.minecraft.get()}",
                        java: ">=${libs.versions.java.get()}"
                    ]
                    expectedDependencies.each { id, range ->
                        requireEqual(metadata.depends[id], range, "Fabric ${id} range")
                    }
                    if (metadata.depends.values().any { it == '*' || it.contains('${') }) {
                        throw new GradleException("${archive.name} contains a wildcard or placeholder dependency range")
                    }
                } else if (loader == 'forge') {
                    requireFragments(metadataText, [
                        'modLoader="javafml"',
                        'loaderVersion="[65,)"',
                        'license="CC0-1.0"',
                        'modId="derk_easy_inventory_crafter"',
                        "version=\"${exactVersion}\"",
                        'displayName="Seamless Crafting"',
                        'modId="forge"',
                        'versionRange="[65.1.3,66)"',
                        'modId="minecraft"',
                        'versionRange="[26.2,26.3)"',
                        '[features.derk_easy_inventory_crafter]',
                        'javaVersion="[25,)"'
                    ], 'Forge metadata')
                    if (metadataText.contains('versionRange="*"')) {
                        throw new GradleException("${archive.name} contains a wildcard dependency range")
                    }
                } else {
                    requireFragments(metadataText, [
                        'modLoader="javafml"',
                        'loaderVersion="[1,)"',
                        'license="CC0-1.0"',
                        'modId="derk_easy_inventory_crafter"',
                        "version=\"${exactVersion}\"",
                        'displayName="Seamless Crafting"',
                        'modId="neoforge"',
                        'versionRange="[26.2.0.75,26.3)"',
                        'modId="minecraft"',
                        'versionRange="[26.2,26.3)"',
                        '[features.derk_easy_inventory_crafter]',
                        'javaVersion="[25,)"'
                    ], 'NeoForge metadata')
                    if (metadataText.contains('versionRange="*"')) {
                        throw new GradleException("${archive.name} contains a wildcard dependency range")
                    }
                }
            }
        }
    }
}

tasks.named('assemble') { dependsOn subprojects.collect { it.tasks.named('assemble') } }
tasks.named('check') {
    dependsOn tasks.named('verifyCommonIsolation')
    dependsOn tasks.named('verifyLoaderJars')
    dependsOn subprojects.collect { it.tasks.named('check') }
}
