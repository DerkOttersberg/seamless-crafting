plugins {
    id 'base'
    alias(libs.plugins.architectury)
    alias(libs.plugins.loom) apply false
}

architectury { minecraft = libs.versions.minecraft.get() }

allprojects {
    group = rootProject.maven_group
    version = rootProject.mod_version

    repositories {
        mavenCentral()
        maven { url = 'https://maven.fabricmc.net/' }
        maven { url = 'https://maven.minecraftforge.net/' }
        maven { url = 'https://maven.neoforged.net/releases/' }
        maven { url = 'https://maven.architectury.dev/' }
    }
}

subprojects {
    apply plugin: 'java-library'
    apply plugin: 'maven-publish'

    java {
        toolchain.languageVersion = JavaLanguageVersion.of(libs.versions.java.get().toInteger())
        withSourcesJar()
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.release = libs.versions.java.get().toInteger()
    }

    tasks.withType(Test).configureEach { useJUnitPlatform() }

    publishing {
        publications {
            register('mavenJava', MavenPublication) {
                from components.java
                artifactId = "${rootProject.archives_base_name}-${project.name}"
            }
        }
        repositories { mavenLocal() }
    }
}

// Gradle may otherwise overlap a loader compile that consumes common's jar with
// another project's clean task when `clean check build` runs in parallel.
def allCleanTasks = allprojects.collect { it.tasks.named('clean') }
allprojects {
    tasks.configureEach { task ->
        if (task.name != 'clean') task.mustRunAfter(allCleanTasks)
    }
}

tasks.register('verifyCommonIsolation') {
    group = 'verification'
    inputs.files(fileTree('common/src') { include '**/*.java' })
    doLast {
        def forbidden = ['net.fabricmc.', 'net.minecraftforge.', 'net.neoforged.']
        def violations = []
        inputs.files.files.sort().each { source ->
            source.eachLine { line, number ->
                if (forbidden.any { line.contains(it) }) violations << "${source}:${number}: ${line.trim()}"
            }
        }
        if (!violations.isEmpty()) throw new GradleException("Loader imports found in common:\n${violations.join('\n')}")
    }
}

def loaderJarFiles = ['fabric', 'forge', 'neoforge'].collectEntries { loader ->
    [(loader): project(":${loader}").tasks.named('jar', Jar).flatMap { it.archiveFile }]
}

tasks.register('verifyLoaderJars') {
    group = 'verification'
    dependsOn ':fabric:jar', ':forge:jar', ':neoforge:jar'
    inputs.files(loaderJarFiles.values())
    doLast {
        def specifications = [
            fabric: [expected: 'fabric.mod.json', forbidden: ['META-INF/mods.toml', 'META-INF/neoforge.mods.toml']],
            forge: [expected: 'META-INF/mods.toml', forbidden: ['fabric.mod.json', 'META-INF/neoforge.mods.toml']],
            neoforge: [expected: 'META-INF/neoforge.mods.toml', forbidden: ['fabric.mod.json', 'META-INF/mods.toml']]
        ]
        specifications.each { loader, specification ->
            def archive = loaderJarFiles[loader].get().asFile
            new java.util.zip.ZipFile(archive).withCloseable { zip ->
                if (zip.getEntry(specification.expected) == null) throw new GradleException("${archive.name} is missing ${specification.expected}")
                specification.forbidden.each { entry ->
                    if (zip.getEntry(entry) != null) throw new GradleException("${archive.name} contains stale metadata ${entry}")
                }
                if (zip.getEntry('io/github/derkottersberg/seamlesscrafting/SeamlessCraftingMod.class') == null) throw new GradleException("${archive.name} is missing common code")
                if (zip.getEntry('seamless_crafting.mixins.json') == null) throw new GradleException("${archive.name} is missing mixin metadata")
            }
        }
    }
}

tasks.named('assemble') { dependsOn subprojects.collect { it.tasks.named('assemble') } }
tasks.named('check') {
    dependsOn tasks.named('verifyCommonIsolation')
    dependsOn tasks.named('verifyLoaderJars')
    dependsOn subprojects.collect { it.tasks.named('check') }
}
